<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="Look up, understand, and practise maths notation for the Irish Leaving Cert and university.">
  <title>Symbolingo · Maths in plain English</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23274739'/%3E%3Ctext x='17' y='46' font-family='serif' font-size='43' fill='white'%3E∀%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <button type="button" class="brand" id="home" aria-label="Symbolingo home"><span class="mark" aria-hidden="true">∀</span>Symbolingo<span class="brand-dot">.</span></button>
      <nav id="tracks" aria-label="Study track">
        <button type="button" class="track" data-track="lc" aria-pressed="false">Leaving Cert</button>
        <button type="button" class="track" data-track="uni" aria-pressed="false">University</button>
      </nav>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <section id="welcome" class="welcome" aria-labelledby="welcome-heading">
      <div class="welcome-copy">
        <h1 id="welcome-heading">Maths in<br><em>plain English.</em></h1>
        <p>Look up a symbol, see it in context, and practise until it makes sense.</p>
      </div>
      <div class="track-choices">
        <button type="button" class="choice" data-track="lc">
          <span class="choice-symbol" aria-hidden="true">f(x)</span>
          <span><strong>Leaving Cert</strong><small>Irish Ordinary and Higher Level maths</small></span>
          <span aria-hidden="true">→</span>
        </button>
        <button type="button" class="choice" data-track="uni">
          <span class="choice-symbol" aria-hidden="true">∀x</span>
          <span><strong>University</strong><small>Maths notation by branch, from proofs to modelling</small></span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
    <p id="load-error" role="alert" hidden></p>
    <section id="workspace" hidden aria-labelledby="track-heading">
      <div class="intro">
        <div>
          <h1 id="track-heading" tabindex="-1"></h1>
          <p id="track-description"></p>
        </div>
        <dl class="stats" aria-label="Your progress">
          <div><dt>Cards opened</dt><dd id="opened">0</dd></div>
          <div><dt>Quiz accuracy</dt><dd id="accuracy">—</dd></div>
        </dl>
      </div>
      <div class="layout">
        <aside class="sidebar">
          <div id="level-label">
            <label for="level">Exam level</label>
            <select id="level">
              <option value="ordinary">Ordinary Level</option>
              <option value="higher">Higher Level</option>
            </select>
          </div>
          <label for="topic" id="topic-label">Topic</label>
          <select id="topic"></select>
          <p id="syllabus"><a href="https://ncca.ie/media/2122/lc-mathematics-syllabus.pdf">Leaving Cert Mathematics syllabus</a></p>
        </aside>
        <div class="learning">
          <nav id="modes" aria-label="Learning mode">
            <button type="button" data-mode="learn" aria-pressed="true">Learn</button>
            <button type="button" data-mode="quiz" aria-pressed="false">Quiz</button>
            <button type="button" data-mode="flash" aria-pressed="false">Rapid Fire</button>
            <button type="button" data-mode="review" aria-pressed="false">Review <span id="due-count" hidden></span></button>
          </nav>
          <div id="filters" class="filters">
            <label class="search-label" for="search">Find notation
              <input id="search" type="search" placeholder="e.g. ∑, sigma, or absolute value" autocomplete="off">
            </label>
            <label class="check"><input type="checkbox" id="saved-only"> Saved only</label>
          </div>
          <p id="notice" role="status" class="notice" hidden></p>
          <p id="part-status" class="sr-only" role="status"></p>
          <div id="results" hidden></div>
          <div id="stage"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>Free pilot · Progress is saved on this device.</footer>
  <noscript><p class="shell">Enable JavaScript to use the notation library and practise cards.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
